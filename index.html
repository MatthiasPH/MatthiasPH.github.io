<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Matthias Paterson-Hawes, mechanical engineering student at the University of Auckland.">
  <title>Matthias Paterson-Hawes</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --background: #080808;
      --foreground: #f6f6f6;
      --accent: #ff742e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      max-width: 55rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3.5rem);
      display: grid;
      grid-template-rows: auto minmax(min-content, 1fr) auto;
      background: var(--background);
      color: var(--foreground);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .mark {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.12em;
      line-height: 1;
    }

    .mark span {
      color: var(--accent);
    }

    main {
      grid-row: 2;
      align-self: center;
      padding-block: 3rem 4.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 650;
      line-height: 1.06;
      letter-spacing: -0.06em;
      overflow-wrap: anywhere;
    }

    h1 span {
      display: block;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem clamp(1.5rem, 4vw, 2.5rem);
      margin-top: 1.25rem;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: inherit;
      text-underline-offset: 0.3em;
      text-decoration-color: #757575;
      transition: color 180ms ease, text-decoration-color 180ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--accent);
      text-decoration-color: currentColor;
    }

    nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      nav a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="mark" aria-hidden="true">m<span>.</span></header>
  <main>
    <h1>Matthias <span>Paterson-Hawes</span></h1>
    <nav aria-label="Portfolio">
      <a href="projects.html">Projects</a>
      <a href="experience.html">Experience</a>
    </nav>
  </main>
</body>
</html>
